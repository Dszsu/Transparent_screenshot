name: Temp Cache Harvest

# Temporary workflow (to be removed after use): builds once on CI and uploads
# the populated Gradle dependency caches so they can be restored into a
# local Gradle user home for offline builds.

on:
  push:
    branches: [update]

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (resolves all dependencies)
        run: ./gradlew clean assembleRelease

      - name: Pack Gradle caches
        run: tar -czf gradle-caches.tar.gz -C "$HOME" .gradle/caches

      - name: Upload Gradle caches
        uses: actions/upload-artifact@v7
        with:
          name: gradle-caches
          path: gradle-caches.tar.gz
          retention-days: 3
