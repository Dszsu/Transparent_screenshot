# Changes vs. the previous version (landed 2026-11-03):
#  1. Adds workflow_dispatch (manual run / backfill / test on an old release)
#     and release: edited, so body edits after publishing also sync.
#  2. Retries the APK/asset download for up to ~30 minutes, closing the
#     upload race: 2.1.1 was published 08:52 but its APK only appeared 09:07,
#     so the current immediate download would most likely fail on the next
#     publish if the same habit holds.
#  3. Propagates the prerelease flag instead of always creating a full release.
#  4. Syncs ALL release assets, not just *.apk (current workflow drops the rest).
#  5. gh release delete gains --cleanup-tag, so a re-sync no longer leaves
#     orphan tags behind (the target repo already has 8 tags for 6 releases:
#     v2.0.0 and 10-1.0 are such leftovers).
#  6. Release body is fetched via the API instead of being interpolated into
#     a heredoc, so a body containing the heredoc terminator (or special
#     characters) can no longer truncate it.
#  7. Target tag is CONVERTED to the format the LSPosed modules repo
#     requires, exactly "VersionCode-VersionName": the numeric versionCode
#     is extracted from the source tag and the versionName from the release
#     name (leading "v", spaces and suffixes are stripped). If extraction
#     fails, a sanitised {tag}-{name} is used as fallback — the LSPosed
#     repo bot auto-corrects non-compliant tags, so the sync never blocks
#     on tag format.
#  8. Assets are fully downloaded BEFORE the old target release is deleted,
#     so a download failure no longer destroys the live target release.
#     (Remaining known risk, unchanged: if create fails after delete, the
#     target release is gone until the workflow is re-run via workflow_dispatch.)
#  NOT changed: the target repo, the {tag}-{name} tag scheme, the
#  "自动同步自 ..." footer, and the LSPOSED_PAT secret.

name: Sync Release to LSPosed Module Repo

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Source release tag to sync (e.g. 212)"
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch release metadata and body via API
        id: meta
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${{ steps.tag.outputs.tag }}" \
            --jq '{name: .name, prerelease: .prerelease, body: .body, assets: (.assets | length)}' > release_meta.json
          jq -r '.body // ""' release_meta.json > release_body.md
          echo "name=$(jq -r '.name // ""' release_meta.json)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.prerelease' release_meta.json)" >> "$GITHUB_OUTPUT"
          echo "assets=$(jq -r '.assets' release_meta.json)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download release assets (retry up to ~30 min)
        if: steps.meta.outputs.assets != '0'
        run: |
          mkdir -p assets
          for i in $(seq 1 30); do
            if gh release download "${{ steps.tag.outputs.tag }}" \
              --repo "${{ github.repository }}" --dir assets; then
              ls -la assets
              exit 0
            fi
            echo "Assets not available yet (attempt $i/30); waiting 60s..."
            sleep 60
          done
          echo "Release assets never appeared; failing before touching the target release."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync to Xposed-Modules-Repo
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NAME="${{ steps.meta.outputs.name }}"
          # Convert to the tag format the LSPosed modules repo requires,
          # exactly "VersionCode-VersionName": extract the numeric
          # versionCode from the source tag and the versionName from the
          # release name. Never block on format — if extraction fails,
          # fall back to a sanitised {tag}-{name}; the LSPosed repo bot
          # auto-corrects non-compliant tags.
          CODE="$(printf '%s' "$TAG" | grep -oE '[0-9]+' | head -n 1 || true)"
          VNAME="$(printf '%s' "$NAME" | sed -E 's/^[vV][[:space:]]*//' | grep -oE '[0-9]+(\.[0-9A-Za-z]+)+' | head -n 1 || true)"
          if [ -z "$VNAME" ]; then
            VNAME="$(printf '%s' "$NAME" | grep -oE '[0-9]+(\.[0-9A-Za-z]+)*' | head -n 1 || true)"
          fi
          if [ -n "$CODE" ] && [ -n "$VNAME" ]; then
            TARGET_TAG="${CODE}-${VNAME}"
          else
            TARGET_TAG="$(printf '%s-%s' "$TAG" "$NAME" | tr -c 'A-Za-z0-9._-' '-')"
            echo "::warning::Could not extract VersionCode-VersionName from source tag '$TAG' / name '$NAME'; using fallback target tag '$TARGET_TAG' (the LSPosed bot will auto-correct it if needed)."
          fi
          echo "Target tag: $TARGET_TAG"

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "自动同步自 [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG})" >> release_body.md

          gh release delete "$TARGET_TAG" \
            --repo Xposed-Modules-Repo/com.dszsu.tss --cleanup-tag --yes 2>/dev/null || true

          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Attach every downloaded asset (not just *.apk). Assets live in
          # their own assets/ folder so repo files are never attached.
          # If the release has no assets, create it without attachments.
          # shellcheck disable=SC2086
          if ls assets/* >/dev/null 2>&1; then
            gh release create "$TARGET_TAG" \
              --repo Xposed-Modules-Repo/com.dszsu.tss \
              --title "$NAME" \
              --notes-file release_body.md \
              $PRERELEASE_FLAG \
              assets/*
          else
            gh release create "$TARGET_TAG" \
              --repo Xposed-Modules-Repo/com.dszsu.tss \
              --title "$NAME" \
              --notes-file release_body.md \
              $PRERELEASE_FLAG
          fi
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_PAT }}
