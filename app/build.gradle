plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.dszsu.tss'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = "com.dszsu.tss"
        minSdk = 29
        targetSdk = 37
        versionCode = 212
        versionName = '2.1.2'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
    lint {
        disable += ['GradleDependency', 'NewerVersionAvailable', 'IconLocation', 'IconLauncherShape']
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
dependencies {
    compileOnly libs.api
    // libxposed 的 api/service 类带有 @SinceApi 注解，但两个构件的 POM 都没有
    // 声明对 annotation 构件的依赖，编译时找不到该注解类会给每个带注解的
    // 类报一条 "Cannot find annotation method" 警告，需显式补上（仅编译期）
    compileOnly libs.annotation
}
dependencies {
    implementation libs.swiperefreshlayout
    implementation(libs.service)
}